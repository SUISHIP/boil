<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Boil Animator (動画対応・高速版)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/upng-js/2.1.0/UPNG.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -6px;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- アイコンコンポーネント ---
        const Icon = ({ path, size = 24, className = "", fill = "none", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {path}
            </svg>
        );
        const Upload = (props) => <Icon path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>} {...props} />;
        const Play = (props) => <Icon path={<polygon points="5 3 19 12 5 21 5 3"/>} {...props} />;
        const Pause = (props) => <Icon path={<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>} {...props} />;
        const Download = (props) => <Icon path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>} {...props} />;
        const RefreshCw = (props) => <Icon path={<><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></>} {...props} />;
        const Trash2 = (props) => <Icon path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} {...props} />;
        const Settings = (props) => <Icon path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} {...props} />;
        const Check = (props) => <Icon path={<polyline points="20 6 9 17 4 12"/>} {...props} />;
        const Info = (props) => <Icon path={<><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></>} {...props} />;
        const Images = (props) => <Icon path={<><path d="M18 22H4a2 2 0 0 1-2-2V6" /><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18" /><circle cx="12" cy="8" r="2" /><rect width="16" height="16" x="6" y="2" rx="2" /></>} {...props} />;
        const Film = (props) => <Icon path={<><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></>} {...props} />;

        const DEFAULT_PARAMS = {
            frameCount: 3,
            jitterStrength: 2,
            noiseScale: 0.05,
            speedFps: 10,
            removeWhiteBg: false,
            whiteThreshold: 240,
        };

        // --- 高速ノイズ生成 (事前計算テーブル) ---
        const NOISE_SIZE = 256;
        const noiseTable = new Float32Array(NOISE_SIZE * NOISE_SIZE);
        let _seed = 12345;
        const _rand = () => {
            _seed = (_seed * 9301 + 49297) % 233280;
            return _seed / 233280;
        };
        for(let i=0; i<noiseTable.length; i++){
            noiseTable[i] = _rand();
        }

        const getFastNoise = (x, y) => {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const xf = x - Math.floor(x);
            const yf = y - Math.floor(y);
            
            const tl = noiseTable[Y * NOISE_SIZE + X];
            const tr = noiseTable[Y * NOISE_SIZE + ((X + 1) & 255)];
            const bl = noiseTable[((Y + 1) & 255) * NOISE_SIZE + X];
            const br = noiseTable[((Y + 1) & 255) * NOISE_SIZE + ((X + 1) & 255)];
            
            const u = xf * xf * (3 - 2 * xf);
            const v = yf * yf * (3 - 2 * yf);
            
            return (tl * (1 - u) + tr * u) * (1 - v) + (bl * (1 - u) + br * u) * v;
        };

        // --- 超高速な画像処理関数 ---
        const removeWhiteBackgroundFast = (imageData, threshold) => {
            const data32 = new Uint32Array(imageData.data.buffer);
            const data8 = imageData.data;
            for (let i = 0; i < data32.length; i++) {
                const idx = i * 4;
                if (data8[idx] > threshold && data8[idx + 1] > threshold && data8[idx + 2] > threshold) {
                    data32[i] = 0; // RGBA=0
                }
            }
        };

        const generateBoilFrameFast = (srcImageData, width, height, params, frameIndex) => {
            const outputImg = new ImageData(width, height);
            const src32 = new Uint32Array(srcImageData.data.buffer);
            const dest32 = new Uint32Array(outputImg.data.buffer);
            
            // フレーム毎のオフセット（乱数の代わり）
            const offsetX = (frameIndex * 137) & 255;
            const offsetY = (frameIndex * 149) & 255;
            const offsetX2 = (frameIndex * 163) & 255;
            const offsetY2 = (frameIndex * 179) & 255;

            for (let y = 0; y < height; y++) {
                const nyBase = y * params.noiseScale;
                for (let x = 0; x < width; x++) {
                    const nxBase = x * params.noiseScale;
                    
                    const nx = (getFastNoise(nxBase + offsetX, nyBase + offsetY) - 0.5) * 2;
                    const ny = (getFastNoise(nxBase + offsetX2, nyBase + offsetY2) - 0.5) * 2;

                    const srcX = Math.round(x + nx * params.jitterStrength);
                    const srcY = Math.round(y + ny * params.jitterStrength);

                    if (srcX >= 0 && srcX < width && srcY >= 0 && srcY < height) {
                        dest32[y * width + x] = src32[srcY * width + srcX];
                    }
                }
            }
            return outputImg;
        };

        // --- 動画フレーム抽出ヘルパー ---
        const extractFramesFromVideo = (file, targetFps = 10, maxFrames = 30) => {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                const url = URL.createObjectURL(file);
                video.src = url;
                video.muted = true;
                video.playsInline = true;
                
                video.onloadeddata = async () => {
                    let w = video.videoWidth;
                    let h = video.videoHeight;
                    const MAX_SIZE = 1080;
                    if (w > MAX_SIZE || h > MAX_SIZE) {
                        const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
                        w = Math.floor(w * ratio);
                        h = Math.floor(h * ratio);
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    
                    const frames = [];
                    const duration = video.duration;
                    const totalFrames = Math.min(Math.floor(duration * targetFps), maxFrames);
                    const interval = 1 / targetFps;

                    for (let i = 0; i < totalFrames; i++) {
                        video.currentTime = i * interval;
                        await new Promise((res) => {
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                res();
                            };
                            video.addEventListener('seeked', onSeeked);
                        });
                        ctx.drawImage(video, 0, 0, w, h);
                        frames.push(ctx.getImageData(0, 0, w, h));
                    }
                    URL.revokeObjectURL(url);
                    resolve({ frames, width: w, height: h });
                };
                video.onerror = () => reject(new Error("動画読み込みエラー"));
            });
        };

        // --- メインコンポーネント ---
        const App = () => {
            const [sourceType, setSourceType] = useState(null); // 'image' or 'video'
            const [originalFileName, setOriginalFileName] = useState('');
            const [originalFrames, setOriginalFrames] = useState([]);
            const [processedFrames, setProcessedFrames] = useState([]); // 背景除去後のソース
            
            const [params, setParams] = useState(DEFAULT_PARAMS);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentFrameIndex, setCurrentFrameIndex] = useState(0);
            const [isProcessing, setIsProcessing] = useState(false);
            const [processMessage, setProcessMessage] = useState("処理中...");

            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);
            const requestRef = useRef();

            // 1. ファイルアップロード
            const handleFileUpload = async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                if (file.size > 20 * 1024 * 1024) { // 20MB制限
                    if(!confirm("ファイルサイズが大きいため時間がかかる可能性があります。続行しますか？")) return;
                }

                setOriginalFileName(file.name);
                setIsProcessing(true);
                setProcessMessage("メディアを解析中...");

                try {
                    if (file.type.startsWith('video/')) {
                        setSourceType('video');
                        const result = await extractFramesFromVideo(file, 10, 30); // 最大30フレーム抽出
                        setOriginalFrames(result.frames);
                    } else {
                        setSourceType('image');
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                canvas.width = img.width;
                                canvas.height = img.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                setOriginalFrames([ctx.getImageData(0, 0, img.width, img.height)]);
                            };
                            img.src = e.target?.result;
                        };
                        reader.readAsDataURL(file);
                    }
                } catch (e) {
                    alert("ファイルの読み込みに失敗しました。");
                } finally {
                    setIsProcessing(false);
                }
            };

            // 2. 背景除去の事前処理 Effect
            useEffect(() => {
                if (originalFrames.length === 0) return;
                
                setIsProcessing(true);
                setProcessMessage("背景処理中...");
                
                // UIブロック回避
                setTimeout(() => {
                    const newFrames = originalFrames.map(frame => {
                        const newFrame = new ImageData(new Uint8ClampedArray(frame.data), frame.width, frame.height);
                        if (params.removeWhiteBg) {
                            removeWhiteBackgroundFast(newFrame, params.whiteThreshold);
                        }
                        return newFrame;
                    });
                    
                    setProcessedFrames(newFrames);
                    setIsProcessing(false);
                    setIsPlaying(true);
                    
                    if (canvasRef.current) {
                        canvasRef.current.width = newFrames[0].width;
                        canvasRef.current.height = newFrames[0].height;
                    }
                }, 10);
            }, [originalFrames, params.removeWhiteBg, params.whiteThreshold]);

            // 3. アニメーション（リアルタイム生成描画）
            const animate = useCallback(() => {
                if (!canvasRef.current || processedFrames.length === 0) return;
                
                const totalDisplayFrames = sourceType === 'video' ? processedFrames.length : params.frameCount;
                const srcIndex = sourceType === 'video' ? currentFrameIndex : 0;
                const srcFrame = processedFrames[srcIndex];
                
                // リアルタイムでそのフレームのBoilエフェクトを生成！
                const boiledFrame = generateBoilFrameFast(srcFrame, srcFrame.width, srcFrame.height, params, currentFrameIndex);
                
                const ctx = canvasRef.current.getContext('2d');
                ctx.putImageData(boiledFrame, 0, 0);

                if (isPlaying && totalDisplayFrames > 1) {
                    const timeoutId = setTimeout(() => {
                        setCurrentFrameIndex((prev) => (prev + 1) % totalDisplayFrames);
                        requestRef.current = requestAnimationFrame(animate);
                    }, 1000 / params.speedFps);
                    return () => clearTimeout(timeoutId);
                }
            }, [processedFrames, currentFrameIndex, isPlaying, params, sourceType]);

            useEffect(() => {
                if (isPlaying) {
                    const cleanup = animate();
                    return () => {
                        if (requestRef.current) cancelAnimationFrame(requestRef.current);
                        if (cleanup) cleanup();
                    };
                }
            }, [isPlaying, animate]);

            // --- エクスポート処理 ---
            const getBaseName = (fileName) => fileName.split('.').slice(0, -1).join('.') || fileName;

            const generateAllExportFrames = () => {
                const totalFrames = sourceType === 'video' ? processedFrames.length : params.frameCount;
                const frames = [];
                const w = processedFrames[0].width;
                const h = processedFrames[0].height;
                for (let i = 0; i < totalFrames; i++) {
                    const srcIndex = sourceType === 'video' ? i : 0;
                    frames.push(generateBoilFrameFast(processedFrames[srcIndex], w, h, params, i));
                }
                return frames;
            };

            const handleExportAPNG = async () => {
                if (processedFrames.length === 0) return;
                setIsProcessing(true);
                setProcessMessage("APNG エンコード中...");
                await new Promise(r => setTimeout(r, 50));

                try {
                    const frames = generateAllExportFrames();
                    const buffers = frames.map(f => f.data.buffer);
                    const delays = new Array(frames.length).fill(1000 / params.speedFps);

                    const outputData = window.UPNG.encode(buffers, frames[0].width, frames[0].height, 0, delays);
                    const url = URL.createObjectURL(new Blob([outputData], { type: 'image/png' }));
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `boil_${getBaseName(originalFileName)}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleExportZip = async () => {
                if (processedFrames.length === 0) return;
                setIsProcessing(true);
                setProcessMessage("ZIP 作成中...");
                await new Promise(r => setTimeout(r, 50));

                try {
                    const frames = generateAllExportFrames();
                    const zip = new window.JSZip();
                    const baseName = getBaseName(originalFileName);
                    
                    const promises = frames.map((frameData, index) => {
                        return new Promise((resolve) => {
                            const canvas = document.createElement('canvas');
                            canvas.width = frameData.width;
                            canvas.height = frameData.height;
                            canvas.getContext('2d').putImageData(frameData, 0, 0);
                            canvas.toBlob((blob) => {
                                zip.file(`${baseName}_frame_${String(index).padStart(2, '0')}.png`, blob);
                                resolve();
                            }, 'image/png');
                        });
                    });

                    await Promise.all(promises);
                    const url = URL.createObjectURL(await zip.generateAsync({type: "blob"}));
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `boil_${baseName}.zip`;
                    a.click();
                    URL.revokeObjectURL(url);
                } finally {
                    setIsProcessing(false);
                }
            };

            const handleExportVideo = async () => {
                if (processedFrames.length === 0 || typeof VideoEncoder === 'undefined') {
                    alert("お使いのブラウザは動画出力に未対応です。");
                    return;
                }
                setIsProcessing(true);
                setProcessMessage("動画 エンコード中...");
                await new Promise(r => setTimeout(r, 50));

                try {
                    const frames = generateAllExportFrames();
                    const fps = params.speedFps;
                    let width = frames[0].width;
                    let height = frames[0].height;
                    if (width % 2 !== 0) width -= 1;
                    if (height % 2 !== 0) height -= 1;

                    const muxer = new window.Mp4Muxer.Muxer({
                        target: new window.Mp4Muxer.ArrayBufferTarget(),
                        video: { codec: 'avc', width, height },
                        fastStart: 'in-memory',
                    });

                    const videoEncoder = new VideoEncoder({
                        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                        error: (e) => { throw new Error(e.message); }
                    });

                    videoEncoder.configure({
                        codec: (width * height > 1920 * 1080) ? 'avc1.640033' : 'avc1.4d0029',
                        width, height,
                        bitrate: 5_000_000,
                        framerate: fps
                    });

                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');

                    // 動画ソースの場合は動画の長さ分、画像ソースの場合は5秒間ループ
                    const totalFrames = sourceType === 'video' ? frames.length : fps * 5;
                    const frameDurationMicro = 1_000_000 / fps;

                    // ImageBitmapの準備
                    const bitmaps = await Promise.all(frames.map(f => createImageBitmap(f)));

                    for (let i = 0; i < totalFrames; i++) {
                        const frameIndex = i % frames.length;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(bitmaps[frameIndex], 0, 0, width, height);

                        const frame = new VideoFrame(canvas, { timestamp: i * frameDurationMicro, duration: frameDurationMicro });
                        videoEncoder.encode(frame, { keyFrame: i % fps === 0 });
                        frame.close();
                    }

                    await videoEncoder.flush();
                    muxer.finalize();
                    bitmaps.forEach(b => b.close());

                    const url = URL.createObjectURL(new Blob([muxer.target.buffer], { type: 'video/mp4' }));
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `boil_${getBaseName(originalFileName)}.mp4`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert("動画エンコード失敗: " + e.message);
                } finally {
                    setIsProcessing(false);
                }
            };

            const reset = () => {
                setSourceType(null);
                setOriginalFrames([]);
                setProcessedFrames([]);
                setParams(DEFAULT_PARAMS);
            };

            const totalDisplayFrames = sourceType === 'video' ? processedFrames.length : params.frameCount;

            return (
                <div className="min-h-screen bg-slate-50 selection:bg-indigo-100 pb-12">
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
                        <div className="flex items-center gap-2">
                            <RefreshCw className="text-indigo-600 animate-spin-slow" size={24} />
                            <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                                Line Boil Animator
                            </h1>
                        </div>
                        <button onClick={reset} disabled={processedFrames.length === 0} className="p-2 text-slate-500 hover:text-red-500 transition-colors disabled:opacity-30">
                            <Trash2 size={20} />
                        </button>
                    </header>

                    <main className="container mx-auto max-w-6xl p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* 左カラム: プレビュー */}
                        <div className="lg:col-span-2 flex flex-col gap-4">
                            <div className="relative w-full aspect-square lg:aspect-video bg-slate-200 rounded-xl overflow-hidden shadow-inner border border-slate-300 flex items-center justify-center group"
                                style={{ backgroundImage: `linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%)`, backgroundSize: '20px 20px', backgroundPosition: '0 0, 0 10px, 10px -10px, -10px 0px' }}
                            >
                                {processedFrames.length === 0 ? (
                                    <div className="text-center p-8 bg-white/80 backdrop-blur-sm rounded-lg shadow-lg">
                                        <div className="flex justify-center mb-3 text-indigo-400">
                                            <Upload size={48} />
                                        </div>
                                        <p className="text-lg font-medium text-slate-700 mb-2">メディアをアップロード</p>
                                        <p className="text-sm text-slate-500 mb-4">画像 または 動画 (MP4等)</p>
                                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="image/*, video/*" className="hidden" />
                                        <button onClick={() => fileInputRef.current?.click()} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-medium transition-transform active:scale-95 shadow-md">
                                            ファイルを選択
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        <canvas ref={canvasRef} className="max-w-full max-h-full object-contain shadow-lg" />
                                        {isProcessing && (
                                            <div className="absolute inset-0 bg-black/20 backdrop-blur-[2px] flex items-center justify-center z-20">
                                                <div className="bg-white px-6 py-4 rounded-lg shadow-xl flex items-center gap-3">
                                                    <RefreshCw className="animate-spin text-indigo-600" />
                                                    <span className="font-medium text-slate-700">{processMessage}</span>
                                                </div>
                                            </div>
                                        )}
                                        <div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg flex items-center gap-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                            <button onClick={() => setIsPlaying(!isPlaying)} className="hover:text-indigo-600">
                                                {isPlaying ? <Pause size={20} /> : <Play size={20} />}
                                            </button>
                                            <span className="text-xs font-mono text-slate-500">
                                                FRAME: {currentFrameIndex + 1} / {totalDisplayFrames}
                                            </span>
                                        </div>
                                    </>
                                )}
                            </div>
                            {sourceType === 'video' && (
                                <div className="bg-amber-50 text-amber-700 text-sm p-3 rounded-lg flex items-start gap-2 border border-amber-100">
                                    <div className="mt-0.5"><Info size={16} /></div>
                                    <p>動画が入力されました。動きに合わせてエフェクトが適用されます。(抽出上限: 30フレーム)</p>
                                </div>
                            )}
                        </div>

                        {/* 右カラム: 設定 */}
                        <div className="lg:col-span-1 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col h-full">
                            <div className="flex items-center gap-2 mb-6 text-slate-800 font-semibold border-b pb-2">
                                <Settings size={20} />
                                <h2>設定パラメータ</h2>
                            </div>

                            <div className="space-y-6 flex-1 overflow-y-auto pr-2">
                                <div className="space-y-4">
                                    <label className={`block ${sourceType === 'video' ? 'opacity-50' : ''}`}>
                                        <div className="flex justify-between mb-1">
                                            <span className="text-sm font-medium text-slate-700">フレーム数 {sourceType === 'video' && '(元動画固定)'}</span>
                                            <span className="text-sm text-indigo-600 font-mono">{totalDisplayFrames}</span>
                                        </div>
                                        <input type="range" min="2" max="10" step="1" value={totalDisplayFrames} disabled={sourceType === 'video'} onChange={(e) => setParams({...params, frameCount: Number(e.target.value)})} className="w-full accent-indigo-600 h-2 bg-slate-200 rounded-lg appearance-none" />
                                    </label>

                                    <label className="block">
                                        <div className="flex justify-between mb-1">
                                            <span className="text-sm font-medium text-slate-700">揺れの強さ (Jitter)</span>
                                            <span className="text-sm text-indigo-600 font-mono">{params.jitterStrength}px</span>
                                        </div>
                                        <input type="range" min="0" max="10" step="0.5" value={params.jitterStrength} onChange={(e) => setParams({...params, jitterStrength: Number(e.target.value)})} className="w-full accent-indigo-600 h-2 bg-slate-200 rounded-lg appearance-none" />
                                    </label>

                                    <label className="block">
                                        <div className="flex justify-between mb-1">
                                            <span className="text-sm font-medium text-slate-700">ノイズの細かさ (Scale)</span>
                                            <span className="text-sm text-indigo-600 font-mono">{params.noiseScale}</span>
                                        </div>
                                        <input type="range" min="0.01" max="0.5" step="0.01" value={params.noiseScale} onChange={(e) => setParams({...params, noiseScale: Number(e.target.value)})} className="w-full accent-indigo-600 h-2 bg-slate-200 rounded-lg appearance-none" />
                                    </label>

                                    <label className="block">
                                        <div className="flex justify-between mb-1">
                                            <span className="text-sm font-medium text-slate-700">再生速度 (FPS)</span>
                                            <span className="text-sm text-indigo-600 font-mono">{params.speedFps} fps</span>
                                        </div>
                                        <input type="range" min="2" max="24" step="1" value={params.speedFps} onChange={(e) => setParams({...params, speedFps: Number(e.target.value)})} className="w-full accent-indigo-600 h-2 bg-slate-200 rounded-lg appearance-none" />
                                    </label>
                                </div>

                                <hr className="border-slate-100" />

                                <div className="space-y-4">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${params.removeWhiteBg ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300 bg-white'}`}>
                                            {params.removeWhiteBg && <Check size={14} className="text-white" />}
                                        </div>
                                        <input type="checkbox" checked={params.removeWhiteBg} onChange={(e) => setParams({...params, removeWhiteBg: e.target.checked})} className="hidden" />
                                        <span className="text-sm font-medium text-slate-700">白背景を除去する</span>
                                    </label>

                                    {params.removeWhiteBg && (
                                        <label className="block pl-7 animate-fade-in">
                                            <div className="flex justify-between mb-1">
                                                <span className="text-xs text-slate-500">除去しきい値</span>
                                                <span className="text-xs text-slate-500 font-mono">{params.whiteThreshold}</span>
                                            </div>
                                            <input type="range" min="200" max="255" step="1" value={params.whiteThreshold} onChange={(e) => setParams({...params, whiteThreshold: Number(e.target.value)})} className="w-full accent-slate-400 h-1 bg-slate-200 rounded-lg appearance-none" />
                                        </label>
                                    )}
                                </div>
                            </div>

                            <div className="mt-6 pt-6 border-t border-slate-100 flex flex-col gap-3">
                                <button onClick={handleExportAPNG} disabled={processedFrames.length === 0 || isProcessing} className="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-lg flex items-center justify-center gap-2 font-medium transition-all active:scale-[0.98] disabled:opacity-50">
                                    <Download size={20} /><span>APNG で書き出し</span>
                                </button>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={handleExportVideo} disabled={processedFrames.length === 0 || isProcessing} className="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 py-3 rounded-lg flex items-center justify-center gap-2 font-medium transition-all active:scale-[0.98] disabled:opacity-50">
                                        <Film size={20} /><span>動画 (MP4)</span>
                                    </button>
                                    <button onClick={handleExportZip} disabled={processedFrames.length === 0 || isProcessing} className="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 py-3 rounded-lg flex items-center justify-center gap-2 font-medium transition-all active:scale-[0.98] disabled:opacity-50">
                                        <Images size={20} /><span>連番ZIP</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
